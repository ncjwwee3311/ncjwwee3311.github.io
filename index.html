<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页-N625.</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0a0c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ================= 主页卡片设计 ================= */
        .main-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .main-card h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .main-card p {
            color: #888;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            background: #e5e5e5;
        }

        /* ================= 全屏相册弹窗 ================= */
        .gallery-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none; 
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .gallery-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .close-btn {
            position: fixed;
            top: 30px;
            right: 40px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            z-index: 1001;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 图片网格布局 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 40px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* ================= 大图预览 (Lightbox) ================= */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .lightbox.active img {
            transform: scale(1);
        }
    </style>
</head>
<body>

    <!-- 主页内容 -->
    <div class="main-card">
        <h1>视觉档案</h1>
        <p>记录光影，分享瞬间。<br>点击下方按钮进入我的摄影画廊。</p>
        <button class="btn" id="openGalleryBtn">查看相册</button>
    </div>

    <!-- 全屏相册 -->
    <div class="gallery-overlay" id="galleryOverlay">
        <button class="close-btn" id="closeGalleryBtn">✕</button>
        <h2>摄影作品</h2>
        
        <div class="gallery-grid">
            <!-- 这里已经为你改成了本地图片的路径 -->
            <!-- 前提：请确保你的图片和 index.html 在同一个文件夹里，且名字一致 -->
            
            <div class="gallery-item">
                <img src="1.jpg" alt="照片 1">
            </div>
            
            <div class="gallery-item">
                <img src="2.jpg" alt="照片 2">
            </div>
            
            <div class="gallery-item">
                <img src="3.jpg" alt="照片 3">
            </div>
            
            <div class="gallery-item">
                <img src="4.jpg" alt="照片 4">
            </div>

        </div>
    </div>

    <!-- 大图预览层 -->
    <div class="lightbox" id="lightbox">
        <img src="" alt="大图预览" id="lightboxImg">
    </div>

    <!-- 交互逻辑 -->
    <script>
        const openBtn = document.getElementById('openGalleryBtn');
        const closeBtn = document.getElementById('closeGalleryBtn');
        const galleryOverlay = document.getElementById('galleryOverlay');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const galleryItems = document.querySelectorAll('.gallery-item img');

        openBtn.addEventListener('click', () => {
            galleryOverlay.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            galleryOverlay.classList.remove('active');
        });

        galleryItems.forEach(img => {
            img.addEventListener('click', (e) => {
                lightboxImg.src = e.target.src;
                lightbox.classList.add('active');
            });
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
            setTimeout(() => { lightboxImg.src = ''; }, 300); 
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                galleryOverlay.classList.remove('active');
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
